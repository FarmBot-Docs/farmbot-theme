theme: jekyll-theme-cayman
title: FarmBot Docs Theme
description: Example FarmBot documentation and documentation development resources
url: https://theme.farm.bot/
repository: FarmBot-Docs/farmbot-theme
site_branch: main
logo: /assets/images/farmbot.svg
color: '#434343'
latest_version_number: 2
plugins:
  - jemoji
  - jekyll-github-metadata
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-redirect-from
include:
  - _images
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
modes:
  - internal
algolia:
  application_id: Z1MM044EZ8
  index_name: theme
  search_only_api_key: cad8ec927860485f3a8ac1ce2372be28
  nodes_to_index: 'p,table,h1'
  files_to_exclude:
    - /**/bom.md
    - /**/bom/*
